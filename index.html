
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de asistencia QR</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f5;
    color:#17201a;
}

.card{
    max-width:520px;
    margin:25px auto;
    background:white;
    padding:25px;
    border-radius:24px;
    box-shadow:0 12px 35px rgba(0,0,0,.12);
}

h1{
    margin:0 0 6px;
    font-size:32px;
}

.sub{
    color:#68736d;
    margin-bottom:25px;
    font-size:18px;
}

.info{
    background:#e8f7ed;
    padding:18px;
    border-radius:18px;
    margin-bottom:22px;
}

.info b{color:#286b3c}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 8px;
    font-size:18px;
}

input{
    width:100%;
    padding:18px;
    border:2px solid #d5ddd8;
    border-radius:15px;
    font-size:18px;
}

button{
    width:100%;
    margin-top:22px;
    padding:18px;
    border:0;
    border-radius:15px;
    background:#49a653;
    color:white;
    font-size:19px;
    font-weight:bold;
}

.result{
    display:none;
    margin-top:22px;
    padding:20px;
    border-radius:18px;
    background:#e8f7ed;
    color:#286b3c;
}

.error{
    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:15px;
    background:#ffe8e8;
    color:#a52b2b;
}

.small{
    text-align:center;
    color:#78827c;
    margin-top:25px;
    font-size:13px;
}
</style>
</head>

<body>
<div class="card">

<h1>Control de asistencia</h1>
<div class="sub">Registro de entrada a clase</div>

<div class="info">
<b>📚 Clase seleccionada</b><br><br>
Salón: <span id="salon">—</span><br>
Materia: <span id="materia">—</span><br>
Clase: <span id="clase">—</span><br>
Horario: <span id="horario">—</span>
</div>

<form id="form">
<label>Matrícula</label>
<input id="matricula" type="text" placeholder="Ej. ALU001"
autocomplete="off" required>

<label>PIN</label>
<input id="pin" type="password" placeholder="Ej. 1234"
inputmode="numeric" required>

<button type="submit">Registrar entrada</button>
</form>

<div id="error" class="error"></div>
<div id="result" class="result"></div>

<div class="small">Versión de prueba con datos ficticios.</div>
</div>

<script>
/* CLASES ASOCIADAS A CADA QR */

const clases = {
    "3A01-matematicas": {
        salon:"3°A-01",
        materia:"Matemáticas",
        clase:"Álgebra",
        horario:"08:00–09:00",
        grupo:"3°A"
    },
    "3A01-espanol": {
        salon:"3°A-01",
        materia:"Español",
        clase:"Literatura",
        horario:"09:00–10:00",
        grupo:"3°A"
    },
    "3B02-ciencias": {
        salon:"3°B-02",
        materia:"Ciencias",
        clase:"Física",
        horario:"08:00–09:00",
        grupo:"3°B"
    }
};

/* ALUMNOS FICTICIOS */

const alumnos = {
    "ALU001":{
        pin:"1234",
        nombre:"Diego Hernández",
        grupo:"3°A"
    },
    "ALU002":{
        pin:"2468",
        nombre:"Sofía Martínez",
        grupo:"3°A"
    },
    "ALU003":{
        pin:"1357",
        nombre:"Mateo García",
        grupo:"3°B"
    }
};

/* LEER EL CÓDIGO DEL QR */

const parametros = new URLSearchParams(window.location.search);
let codigoClase = parametros.get("clase");

if(!codigoClase){
    codigoClase = "3A01-matematicas";
}

const claseActual = clases[codigoClase];

/* MOSTRAR LA CLASE */

if(claseActual){
    document.getElementById("salon").textContent = claseActual.salon;
    document.getElementById("materia").textContent = claseActual.materia;
    document.getElementById("clase").textContent = claseActual.clase;
    document.getElementById("horario").textContent = claseActual.horario;
}

/* REGISTRAR ASISTENCIA */

document.getElementById("form").addEventListener("submit",function(e){
    e.preventDefault();

    const matricula = document.getElementById("matricula").value.trim().toUpperCase();
    const pin = document.getElementById("pin").value.trim();
    const error = document.getElementById("error");
    const result = document.getElementById("result");

    error.style.display = "none";
    result.style.display = "none";

    if(!claseActual){
        error.textContent = "❌ Este QR no corresponde a una clase válida.";
        error.style.display = "block";
        return;
    }

    const alumno = alumnos[matricula];

    if(!alumno){
        error.textContent = "❌ Matrícula no encontrada.";
        error.style.display = "block";
        return;
    }

    if(alumno.pin !== pin){
        error.textContent = "❌ PIN incorrecto.";
        error.style.display = "block";
        return;
    }

    if(alumno.grupo !== claseActual.grupo){
        error.textContent = "❌ Esta clase no corresponde a tu grupo.";
        error.style.display = "block";
        return;
    }

    /* VALIDAR EL HORARIO */

    const [inicioTexto, finTexto] = claseActual.horario
        .split(/[–-]/)
        .map(hora => hora.trim());

    function convertirAMinutos(hora){
        const [horas, minutos] = hora.split(":").map(Number);
        return horas * 60 + minutos;
    }

    const ahora = new Date();
    const minutosActuales = ahora.getHours() * 60 + ahora.getMinutes();
    const minutosInicio = convertirAMinutos(inicioTexto);
    const minutosFin = convertirAMinutos(finTexto);

    if(minutosActuales < minutosInicio || minutosActuales >= minutosFin){
        error.textContent = `❌ Fuera de horario. Puedes registrar de ${inicioTexto} a ${finTexto}.`;
        error.style.display = "block";
        return;
    }

    const horaRegistro = ahora.toLocaleTimeString("es-MX",{
        hour:"2-digit",
        minute:"2-digit"
    });

    result.innerHTML = `
        <strong>✅ Entrada registrada</strong><br><br>
        <b>Alumno:</b> ${alumno.nombre}<br>
        <b>Grupo:</b> ${alumno.grupo}<br>
        <b>Salón:</b> ${claseActual.salon}<br>
        <b>Materia:</b> ${claseActual.materia}<br>
        <b>Clase:</b> ${claseActual.clase}<br>
        <b>Horario:</b> ${claseActual.horario}<br>
        <b>Hora de registro:</b> ${horaRegistro}
    `;

    result.style.display = "block";

    const registro = {
        matricula:matricula,
        alumno:alumno.nombre,
        grupo:alumno.grupo,
        salon:claseActual.salon,
        materia:claseActual.materia,
        clase:claseActual.clase,
        horario:claseActual.horario,
        horaRegistro:horaRegistro
    };

    localStorage.setItem("ultimaAsistencia",JSON.stringify(registro));
});
</script>
</body>
</html>
