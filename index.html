<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de asistencia QR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f3;font-family:Arial,sans-serif;color:#17201b}
.card{max-width:470px;margin:25px auto;padding:25px;background:#fff;border-radius:22px;box-shadow:0 8px 28px #0002}
h1{margin:0 0 6px;font-size:27px}.sub{color:#68736d;margin-bottom:20px}
.info{background:#e8f7ed;padding:16px;border-radius:14px;margin-bottom:20px;line-height:1.7}
label{font-weight:bold;display:block;margin:13px 0 7px}input{width:100%;padding:14px;border:1px solid #ccd6cf;border-radius:10px;font-size:17px}
button{width:100%;border:0;border-radius:10px;padding:15px;background:#16a34a;color:#fff;font-weight:bold;font-size:17px;margin-top:18px}
.result{display:none;margin-top:20px;padding:16px;border-radius:14px;line-height:1.6}.ok{background:#e8f7ed;color:#126b35}.bad{background:#ffeded;color:#a32323}
.small{font-size:12px;color:#78827c;text-align:center;margin-top:18px}
</style></head><body>
<div class="card">
<h1>Control de asistencia</h1><div class="sub">Registro de entrada a clase</div>
<div class="info">
<b>📚 Clase según tu matrícula</b><br>
La materia, clase y horario aparecerán después de validar tus datos.
</div>
<form id="f">
<label>Matrícula</label><input id="m" placeholder="Ej. ALU001" autocomplete="off" required>
<label>PIN</label><input id="p" type="password" inputmode="numeric" maxlength="6" placeholder="Ej. 1234" required>
<button>Registrar entrada</button>
</form>
<div id="r" class="result"></div>
<div class="small">Versión de prueba con datos ficticios.</div>
</div>
<script>
const alumnos={"ALU001": {"pin": "1234", "nombre": "Diego Hernández", "grupo": "3°A", "materia": "Matemáticas", "clase": "Álgebra", "horario": "08:00–09:00", "tel": "5550001001"}, "ALU002": {"pin": "2468", "nombre": "Sofía Martínez", "grupo": "3°A", "materia": "Español", "clase": "Literatura", "horario": "09:00–10:00", "tel": "5550001002"}, "ALU003": {"pin": "1357", "nombre": "Mateo García", "grupo": "3°B", "materia": "Ciencias", "clase": "Física", "horario": "08:00–09:00", "tel": "5550001003"}, "ALU004": {"pin": "4321", "nombre": "Valeria López", "grupo": "3°B", "materia": "Historia", "clase": "México", "horario": "10:00–11:00", "tel": "5550001004"}, "ALU005": {"pin": "5678", "nombre": "Santiago Pérez", "grupo": "2°A", "materia": "Inglés", "clase": "Grammar", "horario": "09:00–10:00", "tel": "5550001005"}, "ALU006": {"pin": "9876", "nombre": "Camila Torres", "grupo": "2°A", "materia": "Matemáticas", "clase": "Geometría", "horario": "11:00–12:00", "tel": "5550001006"}, "ALU007": {"pin": "1122", "nombre": "Emiliano Cruz", "grupo": "2°B", "materia": "Computación", "clase": "Programación", "horario": "10:00–11:00", "tel": "5550001007"}, "ALU008": {"pin": "3344", "nombre": "Regina Flores", "grupo": "2°B", "materia": "Biología", "clase": "Célula", "horario": "08:00–09:00", "tel": "5550001008"}};
const r=document.getElementById('r');
document.getElementById('f').addEventListener('submit',e=>{
 e.preventDefault();
 const m=document.getElementById('m').value.trim().toUpperCase(),p=document.getElementById('p').value.trim(),a=alumnos[m];
 if(!a||a.pin!==p){r.className='result bad';r.style.display='block';r.textContent='❌ Matrícula o PIN incorrectos.';return}
 const key='asistencia_'+m;
 if(localStorage.getItem(key)){r.className='result bad';r.style.display='block';r.textContent='⚠️ Esta entrada ya fue registrada en este dispositivo.';return}
 const now=new Date(),hora=now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
 localStorage.setItem(key,JSON.stringify({fecha:now.toLocaleDateString('es-MX'),hora}));
 r.className='result ok';r.style.display='block';
 r.innerHTML=`<b>✅ Entrada registrada</b><br><b>Alumno:</b> ${a.nombre}<br><b>Grupo:</b> ${a.grupo}<br><b>Materia:</b> ${a.materia}<br><b>Clase:</b> ${a.clase}<br><b>Horario:</b> ${a.horario}<br><b>Hora de registro:</b> ${hora}`;
});
</script></body></html>
